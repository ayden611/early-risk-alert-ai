name: Canonical Scorer Contract

on:
  push:
  pull_request:

jobs:
  canonical-scorer-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run frozen canonical scorer contract
        run: python tests/test_canonical_review_score_golden.py
